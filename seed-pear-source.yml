name: Seed Pear Desktop source upload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seed-pear-source.yml

permissions:
  contents: write

jobs:
  seed:
    if: github.event.head_commit.message == 'Seed Pear source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add exact Pear Desktop source tree
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://github.com/pear-devs/pear-desktop/archive/e0d86c2bdecaa466bf314be11e76dde6741e58eb.tar.gz -o /tmp/pear.tar.gz
          mkdir -p /tmp/pear-source
          tar -xzf /tmp/pear.tar.gz -C /tmp/pear-source --strip-components=1
          cp -a /tmp/pear-source/. .
          rm -rf .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -f
          git commit -m "Upload all Pear Desktop source files"
          git push

